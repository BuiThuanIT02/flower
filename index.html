
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b24">
<title>Chúc mừng 20/10</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #f4efe2;
  --glow: #ffe9a8;
  --night: #050b24;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--night);
  color: var(--ink);
  font-family: "Be Vietnam Pro", sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#msg {
  position: fixed;
  top: 9%;
  left: 0;
  right: 0;
  padding: 0 22px;
  text-align: center;
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-size: clamp(22px, 6.4vw, 40px);
  line-height: 1.4;
  text-shadow: 0 0 18px rgba(255,233,168,.55);
  opacity: 0;
  transition: opacity 1.4s ease;
  z-index: 1;
  pointer-events: none;
}

#msg.on { opacity: 1; }

#msg small {
  display: block;
  margin-top: 10px;
  font: 400 clamp(13px,3.6vw,16px)/1.6 "Be Vietnam Pro",sans-serif;
  font-style: normal;
  opacity: .88;
}

#bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom,0px));
  display: flex;
  justify-content: center;
  z-index: 5;
}

button {
  font: 500 14px "Be Vietnam Pro", sans-serif;
  color: var(--ink);
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px;
  padding: 11px 20px;
  backdrop-filter: blur(8px);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid var(--glow);
  outline-offset: 3px;
}

#snd {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top,0px));
  right: 12px;
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  z-index: 10;
}

#snd svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#snd .x { display: none; }
#snd.off .w { display: none; }
#snd.off .x { display: inline; }

/* Trình phát YouTube */
#mus {
  position: fixed;
  width: 200px;
  height: 200px;
  right: 0;
  bottom: 0;
  opacity: .01;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

#mus iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

/* Màn hình mở thiệp */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(5,11,36,.96);
  transition: opacity .6s ease;
}

.card-box {
  width: 100%;
  max-width: 320px;
  padding: 30px 24px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 22px;
  background: rgba(255,255,255,.07);
  text-align: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 40px rgba(255,233,168,.06);
}

.card-box h2 {
  margin: 0 0 14px;
  color: var(--glow);
  font: italic 25px "Playfair Display", Georgia, serif;
}

.card-box p {
  margin: 0 0 22px;
  font-size: 14px;
  line-height: 1.8;
  opacity: .9;
}

.card-box button {
  width: 100%;
  padding: 13px 20px;
  border: 0;
  background: var(--glow);
  color: var(--night);
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 0 20px rgba(255,233,168,.22);
}

#music-status {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(65px + env(safe-area-inset-bottom,0px));
  text-align: center;
  font-size: 11px;
  color: var(--glow);
  opacity: .75;
  z-index: 4;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="overlay">
  <div class="card-box">
    <h2>💌 Chúc Mừng 20/10 💌</h2>
    <p>
      Một món quà nhỏ dành riêng cho bạn.<br>
      Hãy chạm để mở và đón nhận nhé.
    </p>
    <button id="open-btn">Mở Thiệp ❤️</button>
  </div>
</div>

<canvas id="c"></canvas>
<div id="msg" role="status"></div>

<div id="bar">
  <button id="replay">Xem lại ✨</button>
</div>

<button id="snd" class="off" aria-label="Bật hoặc tắt nhạc"
        aria-pressed="false">
  <svg viewBox="0 0 24 24">
    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
    <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="x" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
  </svg>
</button>

<div id="mus">
  <div id="yt-player"></div>
</div>

<div id="music-status"></div>

<script>
/* ========================================
   1. HIỆU ỨNG BẦU TRỜI VÀ HOA QUỲNH
======================================== */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const msg = document.getElementById("msg");

let W, H, D;

function resize() {
  D = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  cv.width = W * D;
  cv.height = H * D;
  ctx.setTransform(D, 0, 0, D, 0, 0);
}

window.addEventListener("resize", resize);
resize();

const rnd = (a,b) => a + Math.random() * (b-a);
const ease = t => {
  t = Math.max(0, Math.min(1,t));
  return t*t*(3-2*t);
};
const seg = (t,a,b) => ease((t-a)/(b-a));

const stars = Array.from({length:100}, () => ({
  x: Math.random(),
  y: Math.random()*.65,
  r: rnd(.4,1.4),
  p: rnd(0,6)
}));

const flies = Array.from({length:34}, () => ({
  x: Math.random(),
  y: rnd(.45,.95),
  r: rnd(1.5,3),
  p: rnd(0,6),
  s: rnd(.2,.6)
}));

const lines = [
  ["Chúc mừng 20/10","Ngày Phụ nữ Việt Nam"],
  ["Hoa Quỳnh chỉ nở một đêm","nhưng vẻ đẹp ấy khiến người ta nhớ mãi."],
  ["Như những người phụ nữ lặng lẽ tỏa hương","giữa đêm dài, cho cuộc sống thêm dịu dàng."],
  ["Chúc bà, mẹ, chị, em và các bạn gái","luôn khỏe mạnh, bình an và được yêu thương."],
  ["Cảm ơn vì đã luôn ở đây.","Chúc mừng ngày 20/10 ♡"]
];

let t0 = performance.now();
let shown = -1;
let messageTimer;

function say(i) {
  msg.classList.remove("on");
  clearTimeout(messageTimer);

  messageTimer = setTimeout(() => {
    msg.innerHTML = lines[i][0] + "<small>" + lines[i][1] + "</small>";
    msg.classList.add("on");
  },700);
}

function petal(cx,cy,ang,L,wd,fill,stroke) {
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(wd,-L*.25,wd*.8,-L*.8,0,-L);
  ctx.bezierCurveTo(-wd*.8,-L*.8,-wd,-L*.25,0,0);
  ctx.fillStyle = fill;
  ctx.fill();

  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = .8;
    ctx.stroke();
  }

  ctx.restore();
}

function leaf(x0,y0,dir,len,g) {
  if (g <= 0) return;

  ctx.save();
  ctx.translate(x0,y0);
  ctx.scale(dir,1);

  const l = len*g;

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(l*.3,-l*.5,l*.8,-l*.35,l,-l*.7);
  ctx.bezierCurveTo(l*.75,-l*.1,l*.35,l*.05,0,0);

  const gr = ctx.createLinearGradient(0,0,l,-l*.7);
  gr.addColorStop(0,"#1d6b45");
  gr.addColorStop(1,"#6fcf8a");

  ctx.fillStyle = gr;
  ctx.fill();

  ctx.strokeStyle = "rgba(200,255,210,.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(l*.5,-l*.3,l,-l*.7);
  ctx.stroke();

  ctx.restore();
}

const sm = t => {
  t = Math.max(0,Math.min(1,t));
  return t*t*t*(t*(t*6-15)+10);
};

const wrap = a => {
  while (a > Math.PI) a -= Math.PI*2;
  while (a <= -Math.PI) a += Math.PI*2;
  return a;
};

function flower(cx,cy,R,T,grow) {
  const p = (T-5)/13;
  const sz = R*(.5+.5*sm(p/.9))*Math.min(1,grow*1.2);
  const ga = .6*sm((p-.3)/.7)*grow;

  const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,sz*2.6);
  glow.addColorStop(0,"rgba(255,244,200,"+ga+")");
  glow.addColorStop(1,"rgba(255,244,200,0)");

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx,cy,sz*2.6,0,Math.PI*2);
  ctx.fill();

  const sw = Math.sin(T*.8)*.015 + Math.sin(T*1.7)*.006;
  const edge = "rgba(220,190,150,.4)";

  const layers = [
    [22,1.05,.07,"rgba(240,190,140,.95)",0,null],
    [18,.92,.2,"#f7f2e6",.07,edge],
    [16,.78,.17,"#fffaf0",.14,edge],
    [14,.6,.15,"#ffffff",.21,edge],
    [10,.42,.13,"#fffdf6",.28,edge]
  ];

  layers.forEach(([n,len,w,col,dl,st],k) => {
    const s = sm((p-dl)/.62);
    const spread = .05+.95*s;
    const L = sz*len*(1.2-.2*s);
    const wd = sz*w*(.75+.25*s)*(1+.5*(1-s)*(k>0));

    for (let i=0;i<n;i++) {
      const a = wrap(i/n*Math.PI*2+k*.2)*spread+sw;
      petal(cx,cy,a,L,wd,col,st);
    }
  });

  const sa = sm((p-.5)/.5);

  if (sa > 0) {
    ctx.globalAlpha = sa;
    ctx.strokeStyle = "rgba(255,214,110,.95)";
    ctx.fillStyle = "#ffd46b";
    ctx.lineWidth = 1;

    for (let i=0;i<46;i++) {
      const a = i*2.4+sw;
      const l = sz*(.14+.12*((i*7)%5)/5)*sa;
      const ex = cx+Math.cos(a)*l;
      const ey = cy+Math.sin(a)*l;

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(ex,ey);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(ex,ey,1.6,0,Math.PI*2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }
}

function frame(now) {
  const T = (now-t0)/1000;

  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#050b24");
  sky.addColorStop(.6,"#0b2352");
  sky.addColorStop(1,"#12406e");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  stars.forEach(s => {
    ctx.fillStyle = "rgba(255,255,255,"+(.35+.4*Math.sin(T*1.5+s.p))+")";
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  });

  const moon = ctx.createRadialGradient(W*.8,H*.17,0,W*.8,H*.17,70);
  moon.addColorStop(0,"rgba(255,250,225,.9)");
  moon.addColorStop(.25,"rgba(255,245,200,.35)");
  moon.addColorStop(1,"rgba(255,245,200,0)");

  ctx.fillStyle = moon;
  ctx.beginPath();
  ctx.arc(W*.8,H*.17,70,0,Math.PI*2);
  ctx.fill();

  [
    [.78,"#0d2d5c",.0035,0],
    [.84,"#0a2349",.005,2],
    [.91,"#071a38",.007,5]
  ].forEach(([y,c,f,p]) => {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(0,H);

    for (let i=0;i<=W;i+=8) {
      ctx.lineTo(i,H*y+Math.sin(i*f+p)*H*.025);
    }

    ctx.lineTo(W,H);
    ctx.fill();
  });

  const cx = W/2;
  const base = H*.9;
  const R = Math.min(W,H*.62)*.3;
  const top = H*.56;

  const grow = seg(T,1,5);
  const sway = Math.sin(T*.8)*4;
  const ty = base-(base-top)*grow;

  ctx.strokeStyle = "#2f9a5e";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx,base);
  ctx.quadraticCurveTo(cx-14+sway,(base+ty)/2,cx+sway,ty);
  ctx.stroke();

  leaf(cx-4,base-(base-top)*.15*grow,-1,R*1.5,seg(T,2,6));
  leaf(cx+4,base-(base-top)*.3*grow,1,R*1.7,seg(T,2.6,6.6));
  leaf(cx-2,base-(base-top)*.55*grow,-1,R*1.2,seg(T,3.4,7));

  if (grow > .05) flower(cx+sway,ty-R*.05,R,T,grow);

  flies.forEach(f => {
    const px = ((f.x+Math.sin(T*f.s+f.p)*.04)%1)*W;
    const py = (f.y+Math.cos(T*f.s*1.3+f.p)*.03)*H;
    const a = .5+.5*Math.sin(T*2+f.p);

    const fg = ctx.createRadialGradient(px,py,0,px,py,f.r*5);
    fg.addColorStop(0,"rgba(215,255,150,"+a+")");
    fg.addColorStop(1,"rgba(215,255,150,0)");

    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(px,py,f.r*5,0,Math.PI*2);
    ctx.fill();
  });

  const idx = T < 2 ? -1 : Math.min(lines.length-1,Math.floor((T-2)/5.5));

  if (idx !== shown && idx >= 0) {
    shown = idx;
    say(idx);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

function replayAnimation() {
  t0 = performance.now();
  shown = -1;
  clearTimeout(messageTimer);
  msg.classList.remove("on");
}

/* ========================================
   2. YOUTUBE - PHÁT 0s ĐẾN 45s
======================================== */

const VIDEO_ID = "nTEYgZywpPA";
const MUSIC_DURATION = 45000;
const FADE_DURATION = 4000;

const snd = document.getElementById("snd");
const statusText = document.getElementById("music-status");

let player = null;
let playerReady = false;
let soundOn = false;
let musicEnded = false;
let musicSession = false;
let pendingPlay = false;
let stopTimer = null;
let fadeTimer = null;
let fadeStartTimer = null;
let musicStartedAt = 0;

function updateSoundButton() {
  snd.classList.toggle("off",!soundOn);
  snd.setAttribute("aria-pressed",String(soundOn));
}

function clearMusicTimers() {
  clearTimeout(stopTimer);
  clearTimeout(fadeStartTimer);
  clearInterval(fadeTimer);
  stopTimer = null;
  fadeStartTimer = null;
  fadeTimer = null;
}

function stopMusic() {
  clearMusicTimers();

  if (player && playerReady) {
    player.pauseVideo();
    player.mute();
    player.setVolume(100);
  }

  musicEnded = true;
  musicSession = false;
  soundOn = false;

  statusText.textContent = "Bản nhạc đã kết thúc ♡";
  updateSoundButton();
}

function beginMusicTimers() {
  clearMusicTimers();

  musicStartedAt = performance.now();
  musicSession = true;
  musicEnded = false;

  statusText.textContent = "Một chút nhạc dành riêng cho bạn ♡";

  fadeStartTimer = setTimeout(() => {
    if (!playerReady || musicEnded) return;

    const fadeStarted = performance.now();

    fadeTimer = setInterval(() => {
      const elapsed = performance.now()-fadeStarted;
      const volume = Math.max(0,Math.round(100*(1-elapsed/FADE_DURATION)));

      if (player && playerReady) player.setVolume(volume);

      if (elapsed >= FADE_DURATION) {
        clearInterval(fadeTimer);
      }
    },100);
  },MUSIC_DURATION-FADE_DURATION);

  stopTimer = setTimeout(stopMusic,MUSIC_DURATION);
}

function startMusic() {
  if (!playerReady || !player) {
    pendingPlay = true;
    statusText.textContent = "Đang tải nhạc...";
    return;
  }

  if (musicEnded) {
    clearMusicTimers();
    musicEnded = false;
    musicSession = false;
    player.seekTo(0,true);
    player.setVolume(100);
    player.unMute();
    player.playVideo();
    soundOn = true;
    updateSoundButton();
    statusText.textContent = "Đang phát nhạc...";
    return;
  }

  if (!musicSession) {
    player.seekTo(0,true);
    player.setVolume(100);
    player.unMute();
    player.playVideo();
    soundOn = true;
    updateSoundButton();
    return;
  }

  player.unMute();
  soundOn = true;
  updateSoundButton();
}

function toggleSound() {
  if (!playerReady || !player) {
    statusText.textContent = "Nhạc đang tải, hãy chờ một chút nhé.";
    return;
  }

  if (musicEnded) {
    startMusic();
    return;
  }

  if (soundOn) {
    player.mute();
    soundOn = false;
  } else {
    player.unMute();
    player.setVolume(100);
    soundOn = true;
  }

  updateSoundButton();
}

/* Nạp API chính thức của YouTube */
window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player("yt-player", {
    width: "200",
    height: "200",
    videoId: VIDEO_ID,
    playerVars: {
      autoplay: 0,
      controls: 0,
      playsinline: 1,
      rel: 0,
      enablejsapi: 1
    },
    events: {
      onReady: function() {
        playerReady = true;
        player.mute();

        if (pendingPlay) {
          pendingPlay = false;
          startMusic();
        }
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          if (!musicSession && !musicEnded) {
            beginMusicTimers();
          }
        }

        if (event.data === YT.PlayerState.ENDED) {
          stopMusic();
        }
      },

      onError: function() {
        statusText.textContent =
          "Không phát được video. Hãy kiểm tra kết nối hoặc thử video khác.";
      }
    }
  });
};

/* Tải API sau khi trang đã khởi tạo */
const apiScript = document.createElement("script");
apiScript.src = "https://www.youtube.com/iframe_api";
apiScript.async = true;
document.head.appendChild(apiScript);

/* ========================================
   3. MỞ THIỆP VÀ ĐIỀU KHIỂN
======================================== */

const overlay = document.getElementById("overlay");
const openBtn = document.getElementById("open-btn");

openBtn.addEventListener("click",function() {
  overlay.style.opacity = "0";
  setTimeout(() => overlay.remove(),600);

  replayAnimation();

  // Bắt đầu phát nhạc theo thao tác chạm của người nhận.
  pendingPlay = !playerReady;
  startMusic();
});

snd.addEventListener("click",toggleSound);

document.getElementById("replay").addEventListener("click",function() {
  replayAnimation();

  // Xem lại thiệp cũng phát lại nhạc từ đầu.
  if (playerReady) {
    clearMusicTimers();
    musicEnded = false;
    musicSession = false;
    startMusic();
  }
});
</script>
</body>
</html>
