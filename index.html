
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05091d">
<title>Gửi em - 20/10 🌙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #ffe8a5;
  --white: #fffaf0;
  --night: #05091d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--night);
  color: var(--white);
  font-family: "Be Vietnam Pro", sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#message {
  position: fixed;
  z-index: 3;
  top: 7%;
  left: 7%;
  right: 7%;
  text-align: center;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 1.5s ease, transform 1.5s ease;
  pointer-events: none;
  text-shadow: 0 0 22px rgba(255,232,165,.4);
}

#message.show {
  opacity: 1;
  transform: translateY(0);
}

#message .headline {
  font: italic clamp(24px, 6vw, 38px)/1.4 "Playfair Display", Georgia, serif;
  color: var(--gold);
}

#message .sub {
  margin-top: 10px;
  font-size: clamp(12px, 3.3vw, 15px);
  line-height: 1.9;
  color: rgba(255,250,240,.94);
}

#controls {
  position: fixed;
  z-index: 10;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  color: var(--white);
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px;
  padding: 11px 18px;
  font: 500 13px "Be Vietnam Pro", sans-serif;
  backdrop-filter: blur(8px);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#sound {
  position: fixed;
  z-index: 20;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: 12px;
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
}

#sound svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#sound .cross { display: none; }
#sound.muted .waves { display: none; }
#sound.muted .cross { display: block; }

#status {
  position: fixed;
  z-index: 5;
  bottom: calc(67px + env(safe-area-inset-bottom, 0px));
  left: 15px;
  right: 15px;
  text-align: center;
  font-size: 11px;
  line-height: 1.6;
  color: var(--gold);
  opacity: .85;
  pointer-events: none;
}

#player-container {
  position: fixed;
  width: 200px;
  height: 200px;
  right: 0;
  bottom: 0;
  opacity: .01;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

#player-container iframe {
  width: 200px;
  height: 200px;
  border: 0;
}

#cover {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(50,66,125,.28), transparent 60%),
    #05091d;
  transition: opacity .8s ease;
}

.cover-card {
  width: 100%;
  max-width: 340px;
  padding: 32px 24px;
  border: 1px solid rgba(255,232,165,.35);
  border-radius: 24px;
  text-align: center;
  background: rgba(255,255,255,.045);
  box-shadow: 0 0 55px rgba(255,232,165,.08);
}

.cover-moon {
  font-size: 40px;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 18px rgba(255,232,165,.6));
}

.cover-card h1 {
  margin: 0 0 15px;
  color: var(--gold);
  font: italic 27px "Playfair Display", Georgia, serif;
}

.cover-card p {
  margin: 0 0 24px;
  font-size: 13px;
  line-height: 2;
  color: rgba(255,250,240,.88);
}

#open {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  border: 0;
  color: #10152a;
  font-weight: 600;
  box-shadow: 0 0 22px rgba(255,232,165,.2);
}

#signature {
  position: fixed;
  z-index: 2;
  bottom: 17%;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255,232,165,.65);
  font: italic 15px "Playfair Display", Georgia, serif;
  pointer-events: none;
}

@media (max-height: 650px) {
  #message { top: 4%; }
  #message .headline { font-size: clamp(21px,5vw,30px); }
  #message .sub { margin-top: 5px; line-height: 1.6; }
  #signature { bottom: 14%; }
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<div id="message" aria-live="polite">
  <div class="headline"></div>
  <div class="sub"></div>
</div>

<div id="signature">QZ · gửi em một chút dịu dàng ♡</div>

<button id="sound" class="muted" aria-label="Bật hoặc tắt nhạc" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
    <g class="waves">
      <path d="M16 9a4 4 0 0 1 0 6"/>
      <path d="M18.5 6.5a8 8 0 0 1 0 11"/>
    </g>
    <path class="cross" d="m16 9 5 6m0-6-5 6"/>
  </svg>
</button>

<div id="status">Một món quà nhỏ dành riêng cho em ♡</div>

<div id="controls">
  <button id="replay">Xem lại ✨</button>
</div>

<div id="player-container">
  <div id="yt-player"></div>
</div>

<div id="cover">
  <div class="cover-card">
    <div class="cover-moon">☾</div>
    <h1>Gửi em, ngày 20/10</h1>
    <p>
      Có một bông hoa chỉ chờ đêm xuống để nở.<br>
      Và có một lời chúc nhỏ đang chờ em mở ra.
    </p>
    <button id="open">Mở Thiệp ♡</button>
  </div>
</div>

<script>
/* ==================================
   A. BẦU TRỜI, HOA QUỲNH, SAO BĂNG
================================== */

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const headline = message.querySelector(".headline");
const sub = message.querySelector(".sub");

let W = 0, H = 0, DPR = 1;
let startedAt = performance.now();
let lastMessage = -1;
let messageTimer = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const random = (min,max) => min + Math.random() * (max-min);

function ease(t) {
  t = Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}

function segment(t,a,b) {
  return ease((t-a)/(b-a));
}

const stars = Array.from({length:150}, () => ({
  x: Math.random(),
  y: Math.random()*.78,
  r: random(.4,1.5),
  phase: random(0,Math.PI*2),
  speed: random(.5,1.7)
}));

const fireflies = Array.from({length:28}, () => ({
  x: Math.random(),
  y: random(.48,.95),
  r: random(1,2.6),
  phase: random(0,Math.PI*2),
  speed: random(.3,.8)
}));

const wishes = [
  {
    time: 2,
    title: "Chúc mừng ngày 20/10",
    text: "Mong em có một ngày thật vui và thật nhiều nụ cười."
  },
  {
    time: 7,
    title: "Như hoa Quỳnh giữa đêm",
    text: "Mong những điều dịu dàng luôn tìm đến em, dù ngày dài hay đêm muộn."
  },
  {
    time: 12.5,
    title: "Gửi em một lời chúc nhỏ",
    text: "Chúc em luôn bình an, khỏe mạnh và đủ can đảm theo đuổi những điều mình yêu."
  },
  {
    time: 18,
    title: "Mong thế giới dịu dàng với em",
    text: "Mong những điều bình thường cũng đủ làm em mỉm cười, và những ngày mệt mỏi luôn có nơi để trở về."
  },
  {
    time: 24,
    title: "Một điều ước dưới trời sao",
    text: "Mong mọi điều em âm thầm hy vọng, rồi sẽ có ngày trở thành hiện thực."
  },
  {
    time: 30,
    title: "Chúc em luôn rạng rỡ",
    text: "Không cần ngày nào cũng hoàn hảo, chỉ mong em luôn tìm thấy niềm vui theo cách của riêng mình."
  },
  {
    time: 36,
    title: "Và cuối cùng...",
    text: "Chúc em một ngày 20/10 thật ấm áp. Mong em luôn được trân trọng và yêu thương. ♡"
  }
];

function showWish(index) {
  message.classList.remove("show");
  clearTimeout(messageTimer);

  messageTimer = setTimeout(() => {
    headline.textContent = wishes[index].title;
    sub.textContent = wishes[index].text;
    message.classList.add("show");
  },500);
}

function drawMoon() {
  const x = W*.79;
  const y = H*.19;
  const r = Math.min(W,H)*.055;

  const halo = ctx.createRadialGradient(x,y,r*.3,x,y,r*3.7);
  halo.addColorStop(0,"rgba(255,238,185,.25)");
  halo.addColorStop(1,"rgba(255,238,185,0)");

  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(x,y,r*3.7,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#fff4cf";
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#101a3a";
  ctx.beginPath();
  ctx.arc(x+r*.42,y-r*.18,r*.87,0,Math.PI*2);
  ctx.fill();
}

function drawLandscape() {
  const layers = [
    {y:.77,color:"#0c2145",amp:.023,freq:.006,phase:0},
    {y:.84,color:"#091a37",amp:.026,freq:.008,phase:2},
    {y:.92,color:"#061329",amp:.019,freq:.011,phase:5}
  ];

  layers.forEach(layer => {
    ctx.beginPath();
    ctx.moveTo(0,H);

    for (let x=0;x<=W+8;x+=8) {
      const y = H*layer.y
        + Math.sin(x*layer.freq+layer.phase)*H*layer.amp;
      ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fillStyle = layer.color;
    ctx.fill();
  });
}

function drawLeaf(x,y,dir,length,growth) {
  if (growth<=0) return;

  const L = length*growth;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(dir,1);

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(L*.25,-L*.38,L*.72,-L*.38,L,-L*.68);
  ctx.bezierCurveTo(L*.7,-L*.12,L*.32,L*.1,0,0);

  const gradient = ctx.createLinearGradient(0,0,L,-L*.7);
  gradient.addColorStop(0,"#17623e");
  gradient.addColorStop(1,"#7dd39a");

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.strokeStyle = "rgba(210,255,218,.4)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(L*.5,-L*.25,L,-L*.68);
  ctx.stroke();

  ctx.restore();
}

function drawPetal(x,y,angle,length,width,color,stroke) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(width,-length*.22,width*.75,-length*.72,0,-length);
  ctx.bezierCurveTo(-width*.75,-length*.72,-width,-length*.22,0,0);

  ctx.fillStyle = color;
  ctx.fill();

  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = .65;
    ctx.stroke();
  }

  ctx.restore();
}

function drawFlower(cx,cy,R,t,growth) {
  const bloom = segment(t,5,19);
  const scale = R*(.32+.68*bloom)*growth;
  const sway = Math.sin(t*.7)*.018;

  const halo = ctx.createRadialGradient(cx,cy,0,cx,cy,scale*2.8);
  halo.addColorStop(0,"rgba(255,238,195,.24)");
  halo.addColorStop(1,"rgba(255,238,195,0)");

  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx,cy,scale*2.8,0,Math.PI*2);
  ctx.fill();

  const layers = [
    {n:22,l:1.05,w:.09,c:"#e7c5a3",spread:.04},
    {n:19,l:.91,w:.19,c:"#f4ead9",spread:.08},
    {n:16,l:.76,w:.17,c:"#fff9ed",spread:.14},
    {n:13,l:.61,w:.15,c:"#fffdf6",spread:.20},
    {n:10,l:.44,w:.13,c:"#fffdf9",spread:.27}
  ];

  layers.forEach((layer,k) => {
    const open = segment(t,4+k*.4,14+k*.3);
    const spread = .12+open*.88;

    for (let i=0;i<layer.n;i++) {
      const angle = i/layer.n*Math.PI*2+k*.16;
      drawPetal(
        cx,cy,
        angle*spread+sway,
        scale*layer.l*(.75+.25*open),
        scale*layer.w,
        layer.c,
        "rgba(210,185,151,.42)"
      );
    }
  });

  const center = segment(t,12,18);
  if (center>0) {
    ctx.save();
    ctx.globalAlpha = center;
    ctx.strokeStyle = "#ffdb87";
    ctx.fillStyle = "#ffe5a1";
    ctx.lineWidth = .8;

    for (let i=0;i<34;i++) {
      const angle = i*2.399;
      const len = scale*(.13+.15*((i%5)/5));
      const ex = cx+Math.cos(angle)*len;
      const ey = cy+Math.sin(angle)*len;

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(ex,ey);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(ex,ey,1.2,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* Sao băng và chữ QZ */
const meteors = [];

function createMeteor() {
  const x = random(W*.1,W*1.1);
  const y = random(-H*.1,H*.45);
  const length = random(75,155);
  const speed = random(5,9);
  const angle = random(.45,.8);

  meteors.push({
    x,y,
    vx:-Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    length,
    life:0,
    maxLife:random(38,65),
    alpha:random(.55,.95),
    size:random(.8,1.5),
    label:Math.random()<.45 ? "QZ" : ""
  });
}

let meteorClock = 0;

function drawMeteors() {
  meteorClock++;

  if (meteorClock>random(30,62)) {
    createMeteor();
    meteorClock=0;
  }

  for (let i=meteors.length-1;i>=0;i--) {
    const m=meteors[i];
    m.x+=m.vx;
    m.y+=m.vy;
    m.life++;

    const fade = Math.min(1,m.life/8,(m.maxLife-m.life)/12);
    const alpha = Math.max(0,fade)*m.alpha;

    const tailX=m.x-m.vx*(m.length/10);
    const tailY=m.y-m.vy*(m.length/10);

    const gradient=ctx.createLinearGradient(m.x,m.y,tailX,tailY);
    gradient.addColorStop(0,"rgba(255,244,205,"+alpha+")");
    gradient.addColorStop(1,"rgba(255,244,205,0)");

    ctx.strokeStyle=gradient;
    ctx.lineWidth=m.size;
    ctx.beginPath();
    ctx.moveTo(m.x,m.y);
    ctx.lineTo(tailX,tailY);
    ctx.stroke();

    ctx.fillStyle="rgba(255,247,219,"+alpha+")";
    ctx.beginPath();
    ctx.arc(m.x,m.y,2.1,0,Math.PI*2);
    ctx.fill();

    if (m.label && m.life>5 && m.life<24) {
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.font="italic 11px Georgia";
      ctx.fillStyle="#ffe8a5";
      ctx.shadowColor="#ffe8a5";
      ctx.shadowBlur=9;
      ctx.fillText(m.label,m.x+9,m.y-8);
      ctx.restore();
    }

    if (m.life>m.maxLife || m.x<-200 || m.y>H+100) {
      meteors.splice(i,1);
    }
  }
}

function drawScene(now) {
  const t=(now-startedAt)/1000;

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#040819");
  sky.addColorStop(.52,"#0a1940");
  sky.addColorStop(1,"#142c4c");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  stars.forEach(s => {
    const a=.35+.5*(.5+.5*Math.sin(t*s.speed+s.phase));
    ctx.fillStyle="rgba(255,250,225,"+a+")";
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  });

  drawMoon();
  drawLandscape();
  drawMeteors();

  fireflies.forEach(f => {
    const x=(f.x+Math.sin(t*f.speed+f.phase)*.025)*W;
    const y=(f.y+Math.cos(t*f.speed+f.phase)*.025)*H;
    const a=.25+.65*(.5+.5*Math.sin(t*2+f.phase));

    const glow=ctx.createRadialGradient(x,y,0,x,y,f.r*5);
    glow.addColorStop(0,"rgba(215,255,165,"+a+")");
    glow.addColorStop(1,"rgba(215,255,165,0)");

    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.arc(x,y,f.r*5,0,Math.PI*2);
    ctx.fill();
  });

  /* Hoa Quỳnh mọc từ phía dưới */
  const growth=segment(t,1,7);
  const baseY=H*.89;
  const flowerY=H*.59;
  const stemY=baseY-(baseY-flowerY)*growth;
  const centerX=W*.5+Math.sin(t*.7)*3;
  const flowerSize=Math.min(W,H)*.28;

  const stem=ctx.createLinearGradient(centerX,baseY,centerX,stemY);
  stem.addColorStop(0,"#287449");
  stem.addColorStop(1,"#83c99b");

  ctx.strokeStyle=stem;
  ctx.lineWidth=4;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(centerX,baseY);
  ctx.quadraticCurveTo(centerX-12,(baseY+stemY)/2,centerX,stemY);
  ctx.stroke();

  drawLeaf(centerX-3,baseY-(baseY-flowerY)*.2,-1,flowerSize*1.45,segment(t,2,7));
  drawLeaf(centerX+3,baseY-(baseY-flowerY)*.36,1,flowerSize*1.55,segment(t,2.8,7.5));
  drawLeaf(centerX-2,baseY-(baseY-flowerY)*.59,-1,flowerSize*1.05,segment(t,3.5,8));

  if (growth>.01) {
    drawFlower(centerX,stemY,flowerSize,t,growth);
  }

  const index=wishes.reduce((found,w,i) => t>=w.time ? i : found,-1);

  if (index!==lastMessage && index>=0) {
    lastMessage=index;
    showWish(index);
  }

  requestAnimationFrame(drawScene);
}

requestAnimationFrame(drawScene);

function replayAnimation() {
  startedAt=performance.now();
  lastMessage=-1;
  clearTimeout(messageTimer);
  message.classList.remove("show");
}

/* ==================================
   B. ÂM THANH YOUTUBE
================================== */

const VIDEO_ID="nTEYgZywpPA";
const MUSIC_LIMIT=45; // giây
const FADE_SECONDS=4;

const soundButton=document.getElementById("sound");
const status=document.getElementById("status");

let player=null;
let playerReady=false;
let soundOn=false;
let musicEnded=false;
let musicSession=false;
let stopTimer=null;
let fadeTimer=null;
let fadeDelay=null;

function updateSoundUI() {
  soundButton.classList.toggle("muted",!soundOn);
  soundButton.setAttribute("aria-pressed",String(soundOn));
}

function clearMusicTimers() {
  clearTimeout(stopTimer);
  clearTimeout(fadeDelay);
  clearInterval(fadeTimer);
  stopTimer=null;
  fadeDelay=null;
  fadeTimer=null;
}

function stopMusic() {
  clearMusicTimers();

  if (player && playerReady) {
    player.pauseVideo();
    player.mute();
    player.setVolume(100);
  }

  soundOn=false;
  musicEnded=true;
  musicSession=false;
  updateSoundUI();
  status.textContent="Bản nhạc khép lại, mong em luôn vui ♡";
}

function startMusicTimers() {
  clearMusicTimers();
  musicSession=true;
  musicEnded=false;

  status.textContent="Đang phát nhạc dành riêng cho em ♡";

  fadeDelay=setTimeout(() => {
    if (!playerReady || musicEnded) return;

    const fadeStarted=performance.now();

    fadeTimer=setInterval(() => {
      const elapsed=(performance.now()-fadeStarted)/1000;
      const volume=Math.max(0,Math.round(100*(1-elapsed/FADE_SECONDS)));

      if (player && playerReady && soundOn) {
        player.setVolume(volume);
      }

      if (elapsed>=FADE_SECONDS) {
        clearInterval(fadeTimer);
      }
    },100);
  },(MUSIC_LIMIT-FADE_SECONDS)*1000);

  stopTimer=setTimeout(stopMusic,MUSIC_LIMIT*1000);
}

function playMusicFromStart() {
  if (!playerReady || !player) {
    status.textContent="Nhạc đang tải. Hãy chạm biểu tượng loa sau ít giây nhé.";
    return;
  }

  clearMusicTimers();

  musicEnded=false;
  musicSession=false;
  soundOn=true;

  updateSoundUI();
  player.setVolume(100);
  player.unMute();
  player.seekTo(0,true);
  player.playVideo();

  status.textContent="Đang kết nối với YouTube...";
}

function toggleSound() {
  if (!playerReady || !player) {
    status.textContent="YouTube đang tải. Hãy đợi một chút rồi chạm loa nhé.";
    return;
  }

  if (musicEnded || player.getPlayerState() === YT.PlayerState.ENDED) {
    playMusicFromStart();
    return;
  }

  if (soundOn) {
    player.mute();
    soundOn=false;
  } else {
    player.unMute();
    player.setVolume(100);
    soundOn=true;

    if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
      player.playVideo();
    }
  }

  updateSoundUI();
}

window.onYouTubeIframeAPIReady=function() {
  player=new YT.Player("yt-player",{
    width:"200",
    height:"200",
    videoId:VIDEO_ID,
    playerVars:{
      autoplay:0,
      controls:0,
      playsinline:1,
      rel:0
    },
    events:{
      onReady:function() {
        playerReady=true;
        player.mute();
        status.textContent="Chạm biểu tượng loa ♫ để bật nhạc.";
      },

      onStateChange:function(event) {
        if (event.data===YT.PlayerState.PLAYING) {
          if (!musicSession && !musicEnded) {
            startMusicTimers();
          }
        }

        if (event.data===YT.PlayerState.ENDED) {
          stopMusic();
        }

        if (event.data===YT.PlayerState.BUFFERING) {
          status.textContent="Đang tải nhạc...";
        }
      },

      onError:function(event) {
        soundOn=false;
        updateSoundUI();

        const errors={
          2:"Mã video không hợp lệ.",
          5:"Trình phát không hỗ trợ video này.",
          100:"Video không tồn tại hoặc đã bị gỡ.",
          101:"Video không cho phép nhúng trên trang này.",
          150:"Video không cho phép nhúng trên trang này."
        };

        status.textContent=errors[event.data] ||
          "Không phát được nhạc. Hãy thử một video YouTube khác.";
      }
    }
  });
};

const youtubeAPI=document.createElement("script");
youtubeAPI.src="https://www.youtube.com/iframe_api";
youtubeAPI.async=true;
document.head.appendChild(youtubeAPI);

/* ==================================
   C. NÚT MỞ THIỆP / XEM LẠI
================================== */

const cover=document.getElementById("cover");

document.getElementById("open").addEventListener("click",function() {
  cover.style.opacity="0";
  setTimeout(() => cover.remove(),800);

  replayAnimation();

  // Chỉ phát khi trình phát đã sẵn sàng.
  if (playerReady) {
    playMusicFromStart();
  } else {
    status.textContent="Thiệp đã mở ♡ Nhạc đang tải, chạm loa sau ít giây nhé.";
  }
});

soundButton.addEventListener("click",toggleSound);

document.getElementById("replay").addEventListener("click",function() {
  replayAnimation();

  if (playerReady) {
    playMusicFromStart();
  }
});
</script>
